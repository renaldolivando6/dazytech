# Compose untuk jalan di LOCAL.
#
#   npm run docker:dev        -> dev server + hot reload  http://localhost:3000
#   npm run docker:preview    -> image production persis  http://localhost:8080
#   npm run docker:dev:down   -> matikan semuanya
#
# Setelah package.json berubah, jalankan ulang `npm run docker:dev`: flag
# --renew-anon-volumes membuang node_modules lama di anonymous volume.
#
# File production tetap docker-compose.yml.

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dazytech-dev
    ports:
      - "3000:3000"
    volumes:
      # source di-mount supaya perubahan langsung kelihatan.
      # Database dev ada di ./data/dazytech.db (di-gitignore).
      - .:/app
      # node_modules & .next tetap punya container (jangan ketiban punya host)
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

  # Opsional: cek image production persis seperti di server (Next standalone).
  # Tidak ikut nyala kecuali dipanggil pakai profile "preview".
  # Password admin awalnya tercetak di log: docker logs dazytech-preview
  preview:
    profiles: ["preview"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dazytech-preview
    ports:
      - "8080:3000"
    volumes:
      - dazytech-preview-data:/app/data
    # Sama dengan hardening production (docker-compose.yml).
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/.next/cache:noexec,nosuid,uid=1001,gid=1001,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dazytech-preview-data:
